[project]
name = "unreal-mcp-server"
version = "0.1.0"
description = "Standalone MCP server bridging to an Unreal Engine editor plugin"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0,<2",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
unreal-mcp-server = "mcp_server.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
